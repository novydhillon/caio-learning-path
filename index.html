<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A 26-week Chief AI Officer learning path with lessons, quizzes, homework, references, and progress tracking." />
  <title>Chief AI Officer Learning Path</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('caio-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false"></button>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <div class="eyebrow">EXECUTIVE LEARNING PATH</div>
          <h1>Chief AI Officer</h1>
        </div>
      </div>
      <nav id="course-nav" aria-label="Course sections"></nav>
      <div class="side-card">
        <span class="eyebrow">TARGET</span>
        <strong>26 weeks</strong>
        <p>5–7 hours/week · self-paced</p>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">CAIO DEVELOPMENT PROGRAM</p>
          <h2 id="page-title">Dashboard</h2>
        </div>
        <div class="progress-pill"><span id="overall-progress-text">0% complete</span></div>
      </header>

      <section id="dashboard-view" class="view active"></section>
      <section id="section-view" class="view"></section>
      <section id="lesson-view" class="view"></section>
      <section id="references-view" class="view"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
