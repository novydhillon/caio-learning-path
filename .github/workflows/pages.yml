name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: ${{ github.ref_name == 'dev' && 'github-pages-preview' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: staging
      - name: Assemble production and test sites
        run: |
          mkdir -p site/dev
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='/dev/' production/ site/
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' staging/ site/dev/
          test -f site/index.html
          test -f site/dev/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
